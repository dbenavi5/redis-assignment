apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-api

spec:
  replicas: {{ .Values.pythonApi.replicaCount }}

  selector:
    matchLabels:
      app: python-api

  template:
    metadata:
      labels:
        app: python-api

        {{- if and .Values.istio.enabled .Values.istio.sidecarInjection }}
        sidecar.istio.io/inject: "true"
        {{- end }}

    spec:
      containers:
        - name: python-api

          image: "{{ .Values.pythonApi.image.repository }}:{{ .Values.pythonApi.image.tag }}"

          imagePullPolicy: {{ .Values.pythonApi.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.pythonApi.service.targetPort }}

          envFrom:
            - configMapRef:
                name: redis-cm

            - secretRef:
                name: redis-secret